enabled_checks:
  - node_completeness
  - edge_validity
  - depends_on_consistency
  - dependency_freshness
  - task_completion
  - transitive_closure
  # Byte-identity of the accepted canon documents. Project-type-independent
  # (Markdown under docs/ is language-agnostic), so every pinned profile
  # selects it — a profile that omitted it would silently run without the
  # tripwire, which is the exact failure mode the check exists to prevent.
  - canon_integrity
design_doc_patterns:
  - "docs/design/*.md"
impl_file_patterns:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "app/**/*.ts"
  - "app/**/*.tsx"
test_file_patterns:
  - "tests/**/*.py"
  - "tests/**/*.ts"
  - "tests/**/*.tsx"
  - "tests/**/*.js"
  - "tests/**/*.jsx"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
implementation_suffixes: [".ts", ".tsx", ".js", ".jsx"]
test_suffixes: [".ts", ".tsx", ".js", ".jsx", ".test.ts", ".spec.ts", ".test.js", ".spec.js"]
plan_task_file: "docs/design/implementation_plan.md"
